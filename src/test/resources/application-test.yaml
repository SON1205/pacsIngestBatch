spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:dicom_db}
    username: ${POSTGRES_USER:planitsq}
    password: ${POSTGRES_PASSWORD:planitsq1234}
  batch:
    jdbc:
      initialize-schema: never
    job:
      name: directoryScanJob
      enabled: false

pacs:
  root-path: ${java.io.tmpdir}/medIngestEx-test
  root-folders:
    - Midterm
  sub-folder-pattern: "Midterm\\d{3}"
  chunk-size: 2
  skip-limit: 5

logging:
  level:
    root: WARN
    com.planitsquare.medingestex: DEBUG
    org.springframework.batch: INFO
